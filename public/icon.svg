<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="ConLog">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2b3550"/>
      <stop offset="1" stop-color="#161b2b"/>
    </linearGradient>
  </defs>

  <!-- Rounded terminal window -->
  <rect width="512" height="512" rx="114" fill="url(#bg)"/>

  <!-- Title bar -->
  <circle cx="128" cy="132" r="15" fill="#ff5f57"/>
  <circle cx="178" cy="132" r="15" fill="#febc2e"/>
  <circle cx="228" cy="132" r="15" fill="#28c840"/>

  <!-- Log lines, the shortest one highlighted as an error -->
  <g stroke-linecap="round" stroke-width="26">
    <line x1="120" y1="222" x2="392" y2="222" stroke="#5b6784"/>
    <line x1="120" y1="284" x2="330" y2="284" stroke="#5b6784"/>
    <line x1="120" y1="346" x2="286" y2="346" stroke="#f87171"/>
    <line x1="120" y1="408" x2="360" y2="408" stroke="#5b6784"/>
  </g>
</svg>
