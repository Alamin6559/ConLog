name: Bug report
description: Something in ConLog isn't working
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug.

        **Before you paste any log output, read it.** ConLog shows real system
        logs, which can contain usernames, home paths, hostnames, and tokens
        from your machine. Redact anything you don't want public.

  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you expect, and what did you get instead?
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open the Log Explorer
        2. Set the time window to 24h
        3. ...
    validations:
      required: true

  - type: input
    id: macos-version
    attributes:
      label: macOS version
      placeholder: "e.g. 15.4, or 26.0"
    validations:
      required: true

  - type: dropdown
    id: chip
    attributes:
      label: Mac type
      options:
        - Apple Silicon
        - Intel
    validations:
      required: true

  - type: input
    id: conlog-version
    attributes:
      label: ConLog version
      description: From the release you downloaded, or the commit you built from.
    validations:
      required: true

  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots
      description: Helpful for anything visual. Check them for personal data first.
    validations:
      required: false
